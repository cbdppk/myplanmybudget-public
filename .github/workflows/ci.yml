name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      NEXTAUTH_SECRET: ci_dummy_secret_for_build_and_smoke
      NEXTAUTH_URL: http://127.0.0.1:4010
      AUTH_SECRET: ci_dummy_secret_for_build_and_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Lint
        run: pnpm exec next lint --max-warnings 0

      - name: Security audit
        # Fail CI on HIGH or CRITICAL vulnerabilities in dependencies.
        # Ignored below: advisories confirmed unreachable from app runtime as of
        # 2026-07-22 — all are transitive deps of dev/CI-only tooling already
        # pinned at latest (no upstream fix released yet), or bundled by Next.js
        # itself (sharp). Re-check `pnpm audit --audit-level=high` periodically
        # and drop entries once upstream ships a patched version.
        run: |
          pnpm audit --audit-level=high \
            --ignore CVE-2026-32141 \
            --ignore CVE-2026-33228 \
            --ignore CVE-2026-4867 \
            --ignore CVE-2026-33671 \
            --ignore CVE-2026-4800 \
            --ignore GHSA-6v7q-wjvx-w8wg \
            --ignore CVE-2026-39983 \
            --ignore CVE-2026-41324 \
            --ignore CVE-2026-44240 \
            --ignore CVE-2026-44705 \
            --ignore CVE-2026-12143 \
            --ignore CVE-2026-48779 \
            --ignore CVE-2026-13149 \
            --ignore CVE-2026-59869 \
            --ignore CVE-2026-16221 \
            --ignore GHSA-f88m-g3jw-g9cj \
            --ignore CVE-2026-13676

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke tests
        run: pnpm run test:smoke

  playwright:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      NEXTAUTH_SECRET: ci_dummy_secret_for_build_and_smoke
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci_dummy_secret_for_build_and_smoke
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myplanmybudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma generate + migrate
        run: |
          pnpm prisma:generate
          pnpm exec prisma migrate deploy

      - name: Build
        run: pnpm run build

      - name: Start app
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/myplanmybudget?schema=public
      NEXTAUTH_SECRET: ci_dummy_secret_for_build_and_smoke
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci_dummy_secret_for_build_and_smoke

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myplanmybudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate
        run: |
          pnpm prisma:generate
          pnpm exec prisma migrate deploy

      - name: Build
        run: pnpm run build

      - name: Bundle size check
        run: pnpm run size || true

      - name: Start app
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: pnpm run lhci

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14
